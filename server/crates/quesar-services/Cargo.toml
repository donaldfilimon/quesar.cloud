[package]
name = "quesar-services"
version = "0.1.0"
description = "Server-side services for quesar.cloud: AES-256-GCM sealing of data at rest, byte-compatible with src/lib/server/crypto.server.ts."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
zeroize = "1"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
