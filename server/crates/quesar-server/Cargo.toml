[package]
name = "quesar-server"
version = "0.1.0"
description = "The quesar.cloud server: serves the static export and /api/* from one origin."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "json", "tokio"] }
base64 = "0.22"
http-body-util = "0.1"
percent-encoding = "2"
quesar-db = { path = "../quesar-db" }
quesar-services = { path = "../quesar-services" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"

[dev-dependencies]
http-body-util = { version = "0.1", features = ["channel"] }
tempfile = "3"
