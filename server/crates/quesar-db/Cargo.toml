[package]
name = "quesar-db"
version = "0.1.0"
description = "Postgres access for the quesar.cloud server: the connection pool and the migration runner."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# `quesar_db::test_support`: a throwaway database per test, for this crate's
# tests and for other crates' dev-dependencies (features = ["test-support"]).
test-support = []

[dependencies]
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-webpki"] }
tokio = { version = "1", features = ["fs", "rt"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
quesar-db = { path = ".", features = ["test-support"] }
