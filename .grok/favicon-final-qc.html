<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    html, body { margin: 0; background: #1a1c22; }
    .row { display: flex; gap: 24px; padding: 24px; align-items: flex-end; }
    .cell { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .cell span { font: 11px ui-monospace, monospace; color: #8b96a4; }
    .tile { background: #04060A; }
    svg { display: block; }
  </style>
</head>
<body>
  <div class="row">
    <div class="cell">
      <div class="tile">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="16" height="16">
          <rect width="32" height="32" rx="8" fill="#04060A"/>
          <rect x="4" y="4" width="24" height="24" rx="6" fill="#6ECAD8"/>
          <rect x="9" y="9" width="14" height="14" rx="4" fill="#9B87C9"/>
          <rect x="13" y="13" width="6" height="6" rx="2" fill="#5EC49A"/>
        </svg>
      </div>
      <span>16</span>
    </div>
    <div class="cell">
      <div class="tile">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
          <rect width="32" height="32" rx="8" fill="#04060A"/>
          <rect x="4" y="4" width="24" height="24" rx="6" fill="#6ECAD8"/>
          <rect x="9" y="9" width="14" height="14" rx="4" fill="#9B87C9"/>
          <rect x="13" y="13" width="6" height="6" rx="2" fill="#5EC49A"/>
        </svg>
      </div>
      <span>32</span>
    </div>
    <div class="cell">
      <div class="tile">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="64" height="64">
          <rect width="32" height="32" rx="8" fill="#04060A"/>
          <rect x="4" y="4" width="24" height="24" rx="6" fill="#6ECAD8"/>
          <rect x="9" y="9" width="14" height="14" rx="4" fill="#9B87C9"/>
          <rect x="13" y="13" width="6" height="6" rx="2" fill="#5EC49A"/>
        </svg>
      </div>
      <span>64</span>
    </div>
    <div class="cell">
      <div style="background:#eef1f5;padding:8px">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
          <rect width="32" height="32" rx="8" fill="#04060A"/>
          <rect x="4" y="4" width="24" height="24" rx="6" fill="#6ECAD8"/>
          <rect x="9" y="9" width="14" height="14" rx="4" fill="#9B87C9"/>
          <rect x="13" y="13" width="6" height="6" rx="2" fill="#5EC49A"/>
        </svg>
      </div>
      <span>32 on light</span>
    </div>
  </div>
</body>
</html>
