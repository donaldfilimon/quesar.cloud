<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { background: #2a2e36; color: #ddd; font: 11px/1.3 ui-sans-serif, system-ui; padding: 20px; }
  h2 { font-size: 12px; font-weight: 600; margin: 0 0 12px; color: #fff; }
  .row { display: flex; gap: 28px; align-items: end; margin-bottom: 28px; flex-wrap: wrap; }
  .cell { text-align: center; }
  .cell svg { display: block; background: #111; }
  .s16 svg { width: 16px; height: 16px; }
  .s32 svg { width: 32px; height: 32px; }
  .s64 svg { width: 64px; height: 64px; }
  .label { margin-top: 6px; max-width: 72px; }
  /* also on light chrome like a light tab bar */
  .onlight svg { box-shadow: 0 0 0 4px #f3f1eb; }
</style>
</head>
<body>

<h2>16px (tab size)</h2>
<div class="row">

<div class="cell s16">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
    <rect width="16" height="16" rx="3.5" fill="#05070D"/>
    <rect x="1.5" y="1.5" width="13" height="13" rx="2.6" fill="#22D3EE"/>
    <rect x="3.4" y="3.4" width="9.2" height="9.2" rx="2" fill="#A855F7"/>
    <rect x="5.4" y="5.4" width="5.2" height="5.2" rx="1.3" fill="#34D399"/>
  </svg>
  <div class="label">nested chip</div>
</div>

<div class="cell s16">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
    <rect width="16" height="16" rx="3.5" fill="#22D3EE"/>
    <path d="M3.5 12.3 L3.5 4.3 L8 8 L12.5 4.3 L12.5 12.3" fill="none" stroke="#041016" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="3.5" cy="12.3" r="1.35" fill="#041016"/>
    <circle cx="3.5" cy="4.3" r="1.2" fill="#041016"/>
    <circle cx="8" cy="8" r="1.1" fill="#041016"/>
    <circle cx="12.5" cy="4.3" r="1.2" fill="#041016"/>
    <circle cx="12.5" cy="12.3" r="1.35" fill="#041016"/>
  </svg>
  <div class="label">M on cyan</div>
</div>

<div class="cell s16">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">

<div class="cell s16">

    <rect x="4" y="6.75" width="8" height="2.5" rx="0.55" fill="#A855F7"/>
    <rect x="4" y="4.4" width="8" height="2.5" rx="0.55" fill="#34D399"/>
  </svg>
