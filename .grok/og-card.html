<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Quesar OG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500&family=Spectral:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #05070d;
      --panel: #0a0e16;
      --cyan: #22d3ee;
      --violet: #a855f7;
      --emerald: #34d399;
      --fg: #e8edf6;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: var(--ink);
      color: var(--fg);
    }
    .stage {
      position: relative;
      width: 1200px;
      height: 630px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(ellipse 70% 80% at 18% 28%, rgba(34, 211, 238, 0.10), transparent 58%),
        radial-gradient(ellipse 60% 70% at 84% 42%, rgba(168, 85, 247, 0.11), transparent 55%),
        radial-gradient(ellipse 55% 60% at 52% 92%, rgba(52, 211, 153, 0.09), transparent 52%),
        radial-gradient(ellipse 90% 80% at 50% 50%, #0a0e16 0%, var(--ink) 72%);
    }
    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(232, 237, 246, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(232, 237, 246, 0.035) 1px, transparent 1px);
      background-size: 48px 48px;
      background-position: center center;
      mask-image: radial-gradient(ellipse 72% 68% at 50% 48%, #000 20%, transparent 78%);
      pointer-events: none;
    }
    .stage::after {
      content: "";
      position: absolute;
      inset: 0;
      box-shadow: inset 0 0 180px 40px rgba(5, 7, 13, 0.55);
      pointer-events: none;
    }
    .lockup {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 760px;
    }
    .chip {
      width: 112px;
      height: 112px;
      margin-bottom: 36px;
      filter: drop-shadow(0 0 28px rgba(34, 211, 238, 0.14));
    }
    h1 {
      font-family: "Spectral", Georgia, serif;
      font-weight: 700;
      font-size: 96px;
      line-height: 0.95;
      letter-spacing: -0.03em;
      color: var(--fg);
    }
    .company {
      margin-top: 14px;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-weight: 500;
      font-size: 15px;
      letter-spacing: 0.38em;
      text-indent: 0.38em;
      color: var(--cyan);
      text-transform: uppercase;
    }
    .rule {
      width: 56px;
      height: 1px;
      margin: 26px 0 22px;
      background: linear-gradient(90deg, var(--cyan), var(--violet), var(--emerald));
      opacity: 0.85;
    }
    .sub {
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      font-weight: 400;
      font-size: 24px;
      line-height: 1.3;
      letter-spacing: -0.01em;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="lockup">
      <svg class="chip" viewBox="0 0 80 80" aria-hidden="true">
        <!-- package -->
        <rect x="12" y="12" width="56" height="56" rx="13" fill="#0A0E16" stroke="rgba(232,237,246,0.16)" stroke-width="1.25"/>
        <!-- left pins -->
        <g fill="#64748B">
          <rect x="5" y="22" width="8" height="5" rx="1"/>
          <rect x="5" y="32.5" width="8" height="5" rx="1"/>
          <rect x="5" y="43" width="8" height="5" rx="1"/>
          <rect x="5" y="53.5" width="8" height="5" rx="1"/>
        </g>
        <!-- right pins -->
        <g fill="#64748B">
          <rect x="67" y="22" width="8" height="5" rx="1"/>
          <rect x="67" y="32.5" width="8" height="5" rx="1"/>
          <rect x="67" y="43" width="8" height="5" rx="1"/>
          <rect x="67" y="53.5" width="8" height="5" rx="1"/>
        </g>
        <!-- three stacked die layers: cyan bottom, violet middle, emerald top -->
        <rect x="22" y="44.5" width="36" height="11.5" rx="2.4" fill="#22D3EE"/>
        <rect x="22" y="34.25" width="36" height="11.5" rx="2.4" fill="#A855F7"/>
        <rect x="22" y="24" width="36" height="11.5" rx="2.4" fill="#34D399"/>
      </svg>
      <h1>Quesar</h1>
      <p class="company">MLAI</p>
      <div class="rule"></div>
      <p class="sub">Private intelligence, built around you.</p>
    </div>
  </div>
</body>
</html>
